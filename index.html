<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#20338C" />
<title>Preinscripción — Fundación Mis Habilidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8; --card:#ffffff; --ink:#1B1D1F; --muted:#6C7176; --blue:#20338C; --blue-d:#182765;
    --primary:#E91E8C; --primary-soft:#FCE4EC; --primary-ink:#C2185B;
    --green:#1F7A45; --green-soft:#E6F4EC;
    --amber:#8A6310; --amber-soft:#FBF2DC;
    --red:#A8431A; --red-soft:#FBE9E6;
    --line:#E6E3DD; --shadow:0 1px 3px rgba(27,35,126,.08);
    --radius:14px;
  }
  *{box-sizing:border-box;font-family:'Public Sans','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  [hidden]{display:none!important}

  .topbar{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;padding:18px 20px;box-shadow:0 2px 10px rgba(32,51,140,.22)}
  .topbar .wrap{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar img{width:46px;height:46px;border-radius:12px;background:#fff;object-fit:contain}
  .topbar .eyebrow{font-size:11px;opacity:.85;letter-spacing:.4px;text-transform:uppercase;font-weight:700}
  .topbar h1{margin:1px 0 0;font-size:20px;font-weight:800;font-family:'Archivo',sans-serif}
  .topbar p{margin:2px 0 0;font-size:12.5px;opacity:.9}

  main{max-width:820px;margin:0 auto;padding:22px 20px 80px}
  .note{background:var(--amber-soft);color:var(--amber);border:1px solid #f1e2bd;border-radius:12px;
    padding:11px 14px;font-size:12.5px;margin-bottom:18px;line-height:1.5}
  .err{background:var(--red-soft);color:var(--red);border:1px solid #f0cec3;border-radius:12px;
    padding:11px 14px;font-size:13px;margin-bottom:18px;line-height:1.5}

  fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 20px;margin:0 0 16px;background:var(--card)}
  legend{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--primary-ink);
    padding:2px 10px;background:var(--primary-soft);border-radius:999px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
  .grid .full{grid-column:1/-1}
  .grid .half{grid-column:span 1}
  @media(max-width:640px){.grid{grid-template-columns:1fr}.grid .half{grid-column:1/-1}}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:12px;font-weight:700;color:var(--muted)}
  .fld input,.fld select,.fld textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;background:#fff;color:var(--ink);width:100%}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--primary)}
  .req{color:var(--primary-ink)}
  .inline-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);margin-top:4px}
  .inline-check input{width:auto}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}

  .btn{padding:13px 20px;border-radius:11px;font-size:15px;font-weight:700;border:1.5px solid transparent;white-space:nowrap;width:100%}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-ink)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .btn-line{background:#fff;border-color:var(--line);color:var(--ink)}

  .formhead{margin:2px 0 18px}
  .formhead h2{margin:0;font-size:18px;font-family:'Archivo',sans-serif}
  .formhead p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.5}

  .ok-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:34px 26px;text-align:center;margin-top:10px}
  .ok-card .big{font-size:46px;margin-bottom:10px}
  .ok-card h2{margin:0 0 8px;font-family:'Archivo',sans-serif;color:var(--blue)}
  .ok-card .num{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:15px;
    padding:6px 16px;border-radius:999px;margin:10px 0}
  .ok-card p{color:var(--muted);font-size:13.5px;line-height:1.6}

  .footNote{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;line-height:1.6}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <img src="logo.png" alt="" onerror="this.style.display='none'"/>
    <div>
      <div class="eyebrow">Fundación Mis Habilidades</div>
      <h1>Formulario de preinscripción</h1>
      <p id="cicloTxt"></p>
    </div>
  </div>
</div>

<main>
  <div id="view-form"></div>
  <div id="view-ok" class="ok-card" hidden></div>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const YEAR = new Date().getFullYear();
const NEXT_YEAR = YEAR + 1;
$("#cicloTxt").textContent = `Preinscripciones año lectivo ${NEXT_YEAR}`;

/* Pega aquí la URL de tu Google Apps Script publicado como Aplicación web (termina en /exec). Ver README.md. */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjbPYSwxPLuz3oLzgYc4jrNqlgOLQA1G54WrP9fHX4ma4GI1zEy8E_8Z6AJ9ftL_khAg/exec";

const GRADOS_ASPIRA = ["BABYLAND","TODDLERS","KINDER 3","KINDER 4","TRANSITION","FIRST","SECOND","THIRD","FOURTH","FIFTH"];

const SECTIONS = [
  { legend:"Datos del estudiante", fields:[
    ["anioIngreso","Año lectivo al que aspira ingresar","half","select",[String(YEAR),String(NEXT_YEAR)],null,String(NEXT_YEAR)],
    ["est_gradoAspira","Grado al que aspira","half","select",GRADOS_ASPIRA],
    ["est_nombre","Nombres y apellidos completos","full",null,null,null,null,true],
    ["est_tipoDoc","Tipo de documento","half","select",["R.C. (Registro Civil)","T.I. (Tarjeta de Identidad)","C.C.","Otro"]],
    ["est_doc","Número de documento","half"],
    ["est_expedido","Expedido en","half"],
    ["est_nacDia","Fecha de nacimiento","half","date",null,null,null,true,"calcEdad()"],
    ["est_edad","Edad cumplida","half"],
    ["est_ciudadNac","Ciudad de nacimiento","half"],
    ["est_rh","Grupo sanguíneo y R.H.","half"],
    ["est_eps","E.P.S. donde está afiliado","half"],
    ["est_religion","Religión que profesa","half"],
    ["est_dir","Dirección","full"],
    ["est_cel1","Celular 1","half",null,null,null,null,true],
    ["est_cel2","Celular 2","half"],
    ["est_colegioAnt","Colegio donde estudia","full"],
    ["est_gradoCurso","Grado que cursa actualmente","half"],
  ]},
  { legend:"Datos de la madre", fields:[
    ["mad_nombre","Nombres y apellidos","full"],
    ["mad_cel1","Celular","half"],
  ]},
  { legend:"Datos del padre", fields:[
    ["pad_sinInfo","__CHECK__","full","check","No se tiene información del padre"],
    ["pad_nombre","Nombres y apellidos","full"],
    ["pad_cel1","Celular","half"],
  ]},
];
const ALL_FIELDS = SECTIONS.flatMap(s=>s.fields).filter(f=>f[0]!=="pad_sinInfo");

const DRAFT_KEY = "fmh_preinscripcion_draft_v1";
function loadDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; }catch(e){ return {}; } }
function saveDraft(){
  const rec = {};
  ALL_FIELDS.forEach(f=>{ const el = $("#f_"+f[0]); if(el) rec[f[0]] = el.value; });
  const chk = $("#f_pad_sinInfo"); if(chk) rec.pad_sinInfo = chk.checked;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(rec)); }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

function fieldHTML(f, draft){
  const [key,label,span,type,opts,hint,__unused,required,onchangeExtra] = f;
  const v = draft[key] || "";
  const hintHTML = hint ? `<div class="hint">${esc(hint)}</div>` : "";
  if(type==="check"){
    return `<div class="full"><label class="inline-check">
      <input type="checkbox" id="f_${key}" ${draft.pad_sinInfo?"checked":""} onchange="togglePadre(this.checked)"/> ${esc(opts)}</label></div>`;
  }
  const cls = span==="full" ? "full" : "half";
  const lbl = required ? `${esc(label)} <span class="req">*</span>` : esc(label);
  let input;
  if(type==="select"){
    const def = f[6];
    input = `<select id="f_${key}" ${onchangeExtra?`onchange="${onchangeExtra}"`:""}><option value=""></option>` +
      opts.map(o=>`<option ${(v||def)===o?"selected":""}>${esc(o)}</option>`).join("") + `</select>`;
  } else {
    const t = type||"text";
    input = `<input type="${t}" id="f_${key}" value="${esc(v)}" ${onchangeExtra?`onchange="${onchangeExtra}"`:""}/>`;
  }
  return `<div class="fld ${cls}" data-k="${key}"><label for="f_${key}">${lbl}</label>${input}${hintHTML}</div>`;
}

function calcEdad(){
  const d = $("#f_est_nacDia").value; if(!d) return;
  const b = new Date(d), n = new Date();
  let a = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--;
  if(a>=0 && a<130) $("#f_est_edad").value = a + " años";
  saveDraft();
}
function togglePadre(sinInfo){
  const grid = $("#padreGrid"); if(!grid) return;
  grid.querySelectorAll(".fld").forEach(el=>{ el.style.opacity = sinInfo? .4 : 1; });
  grid.querySelectorAll(".fld input, .fld select").forEach(el=> el.disabled = sinInfo);
  saveDraft();
}

function renderForm(){
  const draft = loadDraft();
  const body = SECTIONS.map(sec=>`
    <fieldset>
      <legend>${esc(sec.legend)}</legend>
      <div class="grid" ${sec.legend==="Datos del padre"?'id="padreGrid"':""}>
        ${sec.fields.map(f=>fieldHTML(f, draft)).join("")}
      </div>
    </fieldset>`).join("");

  $("#view-form").innerHTML = `
    <div class="formhead">
      <h2>Preinscripción ${NEXT_YEAR}</h2>
      <p>Llena los datos del estudiante y de sus padres. Los campos marcados con <span class="req">*</span>
      son obligatorios. Con esta preinscripción quedas en la lista; el proceso de matrícula completo (documentos y firmas)
      se hace después, de forma presencial.</p>
    </div>
    <div id="errBox"></div>
    <form id="preForm" onsubmit="return false" oninput="saveDraft()">
      ${body}
      <button class="btn btn-primary" type="button" id="btnEnviar" onclick="submitForm()">Enviar preinscripción</button>
    </form>
    <div class="footNote">Fundación Mis Habilidades · Datos tratados conforme a la Ley 1581 de 2012 (Habeas Data).</div>`;
  togglePadre(!!draft.pad_sinInfo);
}

async function submitForm(){
  const errBox = $("#errBox");
  errBox.innerHTML = "";

  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PEGA_AQUI") === 0){
    errBox.innerHTML = `<div class="err">⚠️ Este formulario todavía no está conectado a la hoja de cálculo
      (falta configurar <code>APPS_SCRIPT_URL</code> en <code>index.html</code>). Revisa el README.md.</div>`;
    return;
  }

  const rec = {};
  ALL_FIELDS.forEach(f=>{ const el = $("#f_"+f[0]); if(el) rec[f[0]] = el.value.trim(); });
  rec.pad_sinInfo = $("#f_pad_sinInfo").checked;
  if(rec.pad_sinInfo){ rec.pad_nombre = ""; rec.pad_cel1 = ""; }

  if(!rec.est_nombre){ errBox.innerHTML = `<div class="err">Escribe el nombre completo del estudiante.</div>`; return; }
  if(!rec.est_nacDia){ errBox.innerHTML = `<div class="err">Escribe la fecha de nacimiento del estudiante.</div>`; return; }
  if(!rec.est_cel1 && !rec.mad_cel1 && !rec.pad_cel1){
    errBox.innerHTML = `<div class="err">Escribe al menos un número de celular de contacto (estudiante, madre o padre).</div>`; return;
  }

  const btn = $("#btnEnviar");
  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita el preflight CORS de Apps Script
      body: JSON.stringify(rec)
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "Error desconocido");
    clearDraft();
    showOk(data.numero);
  }catch(e){
    errBox.innerHTML = `<div class="err">No se pudo enviar la preinscripción (${esc(e.message||e)}).
      Verifica tu conexión a internet e inténtalo de nuevo. Tus datos quedaron guardados en este dispositivo,
      no se pierden si cierras la página.</div>`;
    btn.disabled = false; btn.textContent = "Enviar preinscripción";
  }
}

function showOk(numero){
  $("#view-form").hidden = true;
  const ok = $("#view-ok");
  ok.hidden = false;
  ok.innerHTML = `
    <div class="big">✅</div>
    <h2>¡Preinscripción recibida!</h2>
    <div class="num">No. de preinscripción ${esc(numero)}</div>
    <p>Guarda este número. Pronto la Fundación se pondrá en contacto contigo para continuar con el proceso
    de matrícula ${NEXT_YEAR}.</p>`;
}

renderForm();
</script>
</body>
</html>
